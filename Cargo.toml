workspace = { members = ["demo"] }
[package]
name = "egui-snarl"
version = "0.2.1"
edition = "2021"
description = "Node-graphs for egui"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/egui-snarl"
keywords = ["egui", "node", "graph", "ui", "node-graph"]
categories = ["gui", "visualization"]

[features]
serde = ["dep:serde", "egui/serde", "slab/serde"]

[dependencies]
#egui = { version = "0.33" }
egui = {git="https://github.com/emilk/egui.git", rev="f714380b66a44dac9a3a1832df45aaf8760c29b8", features=["serde"] }
slab = { version = "0.4" }
serde = { version = "1.0", features = ["derive"], optional = true }
tiny-fn = { version = "0.1.6" }

egui-probe = { version = "0.10", features = ["derive"], optional = true }

[dev-dependencies]
#eframe = { version = "0.33", features = ["serde", "persistence"] }
eframe = {git="https://github.com/emilk/egui.git", rev="f714380b66a44dac9a3a1832df45aaf8760c29b8",  features = ["glow", "serde", "persistence"]  }
#egui_extras = { version = "0.33", features = ["all_loaders"] }
egui_extras = {git="https://github.com/emilk/egui.git", rev="f714380b66a44dac9a3a1832df45aaf8760c29b8",  features=["all_loaders"]}
syn = { version = "2.0", features = ["extra-traits"] }
serde_json = { version = "1.0" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures = "0.4"

[[example]]
name = "demo"
required-features = ["serde", "egui-probe"]

[[example]]
name = "tree"
required-features = ["serde"]
